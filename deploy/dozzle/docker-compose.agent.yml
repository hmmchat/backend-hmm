# Run on the streaming droplet only. The backend Dozzle UI connects here.
# Firewall: allow TCP 7007 from the backend droplet IP only.
#
#   docker compose -f docker-compose.agent.yml up -d
#
services:
  dozzle-agent:
    image: amir20/dozzle:v10.8.0
    container_name: hmm-dozzle-agent
    command: agent
    restart: unless-stopped
    environment:
      DOZZLE_HOSTNAME: ${DOZZLE_HOSTNAME:-beam-streaming}
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DOZZLE_AGENT_BIND:-0.0.0.0}:7007:7007"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
